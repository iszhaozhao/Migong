<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="移动迷宫：黑暗中的第一人称像素迷宫探索，带战争迷雾小地图。" />
    <title>移动迷宫 · 第一人称黑暗探索</title>
    <style>
      :root {
        --site-bg: #000000;
        --site-fg: #cfcbe4;
        --site-accent: #ffc857;
        --site-on-accent: #171327;
        --site-surface: #101018;
        --site-muted: #8a86a0;
        --site-border: #26263a;
        --site-font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
        --site-radius: 0px;
        --site-space: 1;
        --site-type: 1;
      }
      html, body { margin: 0; height: 100%; background: var(--site-bg); overflow: hidden; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: var(--site-font);
      }
      #view { display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; }
      #minimap {
        position: fixed; right: 12px; bottom: 12px; background: #000;
        border: 1px solid #1c1c26; image-rendering: pixelated;
      }
      .hud { position: fixed; left: 12px; top: 10px; color: var(--site-muted); font-size: calc(11px * var(--site-type, 1)); letter-spacing: 0.5px; }
      .hud b { color: var(--site-fg); font-weight: 600; }
      .controls { position: fixed; right: 12px; top: 10px; display: flex; gap: calc(6px * var(--site-space, 1)); }
      button {
        font: inherit; font-size: calc(11px * var(--site-type, 1)); color: var(--site-muted); background: var(--site-surface);
        border: 1px solid var(--site-border); border-radius: var(--site-radius);
        padding: calc(4px * var(--site-space, 1)) calc(9px * var(--site-space, 1)); cursor: pointer;
      }
      button:hover { color: var(--site-fg); border-color: #3a3a55; }
      button:focus-visible { outline: 1px solid #8b7ff0; outline-offset: 1px; }
      .help { position: fixed; left: 12px; bottom: 10px; margin: 0; color: #55516b; font-size: calc(11px * var(--site-type, 1)); }
      .help b { color: var(--site-muted); font-weight: 600; }
      .overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: calc(10px * var(--site-space, 1));
        background: rgba(0, 0, 0, 0.86); text-align: center; padding: calc(16px * var(--site-space, 1));
      }
      .overlay[hidden] { display: none; }
      .overlay-title { margin: 0; color: var(--site-accent); font-size: calc(26px * var(--site-type, 1)); letter-spacing: 6px; }
      .overlay-sub { margin: 0; color: var(--site-muted); font-size: calc(12px * var(--site-type, 1)); line-height: 1.8; }
      .btn-primary { background: var(--site-accent); border-color: var(--site-accent); color: var(--site-on-accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <canvas id="view" width="320" height="180" role="img" aria-label="第一人称迷宫视野，黑暗中只能看到附近墙面"></canvas>
    <canvas id="minimap" width="168" height="120" role="img" aria-label="小地图，仅显示本局已探索区域"></canvas>
    <div class="hud">用时 <b id="time">0.0s</b> · 探索 <b id="explored">0%</b></div>
    <div class="controls">
      <button id="restart" type="button">重新开始 (R)</button>
      <button id="new-maze" type="button">新迷宫 (N)</button>
    </div>
    <p class="help"><b>W/S</b> 或 <b>↑/↓</b> 前进后退 · <b>A/D</b> 或 <b>←/→</b> 转向 · 在黑暗中找到旗帜出口</p>
    <div class="overlay" id="overlay" hidden>
      <p class="overlay-title">通关成功</p>
      <p class="overlay-sub" id="overlay-sub"></p>
      <button class="btn-primary" id="again" type="button">再来一局</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
