<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="移动迷宫：黑暗中的第一人称像素迷宫探索，带战争迷雾小地图。" />
    <title>移动迷宫 · 第一人称黑暗探索</title>
    <style>
      :root {
        --site-bg: #0b0908;
        --site-fg: #e6ddcb;
        --site-accent: #ffc857;
        --site-on-accent: #201607;
        --site-surface: #16110c;
        --site-muted: #a89c86;
        --site-border: #3a3126;
        --site-font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
        --site-radius: 0px;
        --site-space: 1;
        --site-type: 1;
      }
      html, body { margin: 0; height: 100%; background: var(--site-bg); overflow: hidden; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: var(--site-font);
      }
      #view {
        display: block; background: #0b0908; image-rendering: pixelated; image-rendering: crisp-edges;
        outline: 1px solid var(--site-border); box-shadow: 0 0 56px rgba(196, 150, 80, 0.12);
      }
      #minimap {
        position: fixed; right: 16px; bottom: 16px; background: #000;
        border: 1px solid #241f18; image-rendering: pixelated;
      }
      .hud {
        position: fixed; left: 16px; top: 14px; display: flex; align-items: center;
        gap: calc(6px * var(--site-space, 1));
        height: 30px; padding: 0 calc(12px * var(--site-space, 1)); box-sizing: border-box;
        background: rgba(22, 17, 12, 0.78); border: 1px solid var(--site-border);
        color: var(--site-muted); font-size: calc(12px * var(--site-type, 1)); letter-spacing: 0.5px;
      }
      .hud b { color: var(--site-fg); font-weight: 600; }
      .controls { position: fixed; right: 16px; top: 14px; display: flex; gap: calc(8px * var(--site-space, 1)); }
      button {
        font: inherit; font-size: calc(12px * var(--site-type, 1)); color: var(--site-muted); background: var(--site-surface);
        border: 1px solid var(--site-border); border-radius: var(--site-radius);
        height: 30px; padding: 0 calc(12px * var(--site-space, 1)); display: inline-flex; align-items: center; cursor: pointer;
      }
      button:hover { color: var(--site-fg); border-color: #55483a; }
      button:focus-visible { outline: 1px solid #e0b054; outline-offset: 1px; }
      .help {
        position: fixed; left: 16px; bottom: 16px; margin: 0;
        max-width: max(120px, calc(100vw - var(--map-w, 168px) - 56px));
        color: #d8cfbc; font-size: calc(12px * var(--site-type, 1)); line-height: 1.7; letter-spacing: 0.3px;
        text-shadow: 0 1px 2px #000; overflow-wrap: anywhere;
      }
      .help b { color: var(--site-accent); font-weight: 600; }
      @media (max-width: 480px) {
        .hud { left: 12px; top: 12px; }
        .controls { right: 12px; top: 50px; }
        #minimap { right: 12px; bottom: 12px; }
        .help { left: 12px; bottom: 12px; max-width: max(120px, calc(100vw - var(--map-w, 168px) - 48px)); }
      }
      .overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: calc(10px * var(--site-space, 1));
        background: rgba(8, 6, 4, 0.86); text-align: center; padding: calc(16px * var(--site-space, 1));
      }
      .overlay[hidden] { display: none; }
      .overlay-title { margin: 0; color: var(--site-accent); font-size: calc(26px * var(--site-type, 1)); letter-spacing: 6px; }
      .overlay-sub { margin: 0; color: var(--site-muted); font-size: calc(12px * var(--site-type, 1)); line-height: 1.8; }
      .btn-primary { background: var(--site-accent); border-color: var(--site-accent); color: var(--site-on-accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <canvas id="view" width="320" height="180" role="img" aria-label="第一人称迷宫视野，黑暗中只能看到附近墙面"></canvas>
    <canvas id="minimap" width="210" height="150" role="img" aria-label="小地图，仅显示本局已探索区域"></canvas>
    <div class="hud">用时 <b id="time">0.0s</b> · 探索 <b id="explored">0%</b></div>
    <div class="controls">
      <button id="restart" type="button">重新开始 (R)</button>
      <button id="new-maze" type="button">新迷宫 (N)</button>
    </div>
    <p class="help"><b>W/S</b> 移动 · <b>A/D</b> 转向 · 在黑暗中找到出口</p>
    <div class="overlay" id="overlay" hidden>
      <p class="overlay-title">通关成功</p>
      <p class="overlay-sub" id="overlay-sub"></p>
      <button class="btn-primary" id="again" type="button">再来一局</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
